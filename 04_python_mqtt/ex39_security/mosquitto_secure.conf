# Exercise 39 - secured Mosquitto broker
# 1) ./create_password_file.sh   2) ./generate_certs.sh
# 3) mosquitto -c mosquitto_secure.conf -v   (run from this folder)

per_listener_settings true

# Encrypted listener (TLS) - the only port clients should use
listener 8883
allow_anonymous false
password_file ./passwd
cafile ./certs/ca.crt
certfile ./certs/server.crt
keyfile ./certs/server.key
tls_version tlsv1.2
# set to true to also require client certificates (mutual TLS)
require_certificate false

# Plain listener for local testing only, still password protected
listener 1884 localhost
allow_anonymous false
password_file ./passwd
